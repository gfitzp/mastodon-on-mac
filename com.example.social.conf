# Apache httpd virtual host for Mastodon 4.7 on macOS (Homebrew httpd 2.4.47+).
#
# Translated from Mastodon's dist/nginx.conf. Replace social.example.com,
# the certificate paths, and /Users/foo/Sites/mastodon with your own values.
#
# Requires these modules in httpd.conf: proxy, proxy_http, proxy_wstunnel,
# rewrite, headers, deflate, ssl, http2, socache_shmcb.

<VirtualHost *:80>
	ServerName social.example.com

	# Let ACME HTTP-01 challenges through, redirect everything else to HTTPS.
	DocumentRoot "/Users/foo/Sites/mastodon/public"
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerName social.example.com

	Protocols h2 http/1.1

	SSLEngine On
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
	SSLHonorCipherOrder On
	SSLSessionTickets Off
	SSLCertificateFile "/etc/certificates/example.com.crt"
	SSLCertificateKeyFile "/etc/certificates/example.com.key"
	SSLCertificateChainFile "/etc/certificates/example.com.ca-bundle"

	# nginx: keepalive_timeout 70; client_max_body_size 99m; proxy_read_timeout 120;
	KeepAliveTimeout 70
	LimitRequestBody 103809024
	ProxyTimeout 120

	Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

	# Static files are served straight from Mastodon's public/ directory.
	DocumentRoot "/Users/foo/Sites/mastodon/public"
	<Directory "/Users/foo/Sites/mastodon/public">
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# nginx: gzip on; gzip_types ...
	AddOutputFilterByType DEFLATE text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml image/x-icon
	DeflateCompressionLevel 6

	# Headers Mastodon expects from its reverse proxy.
	# mod_proxy adds X-Forwarded-For and X-Forwarded-Host on its own.
	ProxyPreserveHost On
	RequestHeader set X-Real-IP %{REMOTE_ADDR}s
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"
	RequestHeader unset Proxy

	# Streaming API -> Node streaming server on :4000 (WebSocket upgrade).
	ProxyPass        "/api/v1/streaming" "http://127.0.0.1:4000/api/v1/streaming" upgrade=websocket retry=0
	ProxyPassReverse "/api/v1/streaming" "http://127.0.0.1:4000/api/v1/streaming"

	# Everything else: equivalent of nginx "try_files $uri @mastodon".
	# If the request matches a real file under public/ it is served from disk;
	# otherwise it is proxied to Puma on :3000.
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/api/v1/streaming
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteRule ^/(.*)$ http://127.0.0.1:3000/$1 [P,L]
	ProxyPassReverse "/" "http://127.0.0.1:3000/"

	# Cache lifetimes for static asset directories, as in nginx.conf.
	<LocationMatch "^/(assets|avatars|emoji|headers|ocr|packs|sounds)/">
		Header set Cache-Control "public, max-age=2419200, must-revalidate"
	</LocationMatch>

	<LocationMatch "^/system/">
		Header set Cache-Control "public, max-age=2419200, immutable"
		Header set X-Content-Type-Options "nosniff"
		Header set Content-Security-Policy "default-src 'none'; form-action 'none'"
	</LocationMatch>

	# Shown when Puma is down (502/503) or Apache itself errors.
	ErrorDocument 404 /500.html
	ErrorDocument 500 /500.html
	ErrorDocument 501 /500.html
	ErrorDocument 502 /500.html
	ErrorDocument 503 /500.html
	ErrorDocument 504 /500.html
</VirtualHost>
