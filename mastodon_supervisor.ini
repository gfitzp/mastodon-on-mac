; Supervisor configuration for Mastodon 4.7 on macOS with a Homebrew toolchain.
; Mirrors Mastodon's dist/mastodon-web.service, mastodon-sidekiq.service, and
; mastodon-streaming@.service. Replace "foo" with your username and adjust the
; paths if Mastodon is not in ~/Sites/mastodon. Install to
; /opt/homebrew/etc/supervisor.d/mastodon.ini.
;
; .env.production is read by every process itself, so only process-level
; settings need to be given here.
;
; PGGSSENCMODE=disable avoids a libpq GSSAPI crash on macOS when Puma/Sidekiq
; fork. LD_PRELOAD=libjemalloc.so from the Linux units is omitted: it does
; nothing on macOS.

[group:mastodon]
programs=web,sidekiq,streaming

[program:web]
command=/opt/homebrew/opt/ruby/bin/bundle exec puma -C config/puma.rb
directory=/Users/foo/Sites/mastodon
environment=RAILS_ENV=production,PORT=3000,WEB_CONCURRENCY=2,MAX_THREADS=5,RAILS_LOG_LEVEL=warn,PGGSSENCMODE=disable,PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:/opt/homebrew/opt/node@24/bin:/opt/homebrew/opt/postgresql@17/bin:/opt/homebrew/bin:%(ENV_PATH)s"
stdout_logfile=/Users/foo/Sites/mastodon/log/puma.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=5
redirect_stderr=true
autorestart=true
stopasgroup=true
stopwaitsecs=15

[program:sidekiq]
command=/opt/homebrew/opt/ruby/bin/bundle exec sidekiq -c 25
directory=/Users/foo/Sites/mastodon
environment=RAILS_ENV=production,DB_POOL=25,MALLOC_ARENA_MAX=2,RAILS_LOG_LEVEL=warn,PGGSSENCMODE=disable,PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:/opt/homebrew/opt/node@24/bin:/opt/homebrew/opt/postgresql@17/bin:/opt/homebrew/bin:%(ENV_PATH)s"
stdout_logfile=/Users/foo/Sites/mastodon/log/sidekiq.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=5
redirect_stderr=true
autorestart=true
stopasgroup=true
stopwaitsecs=30

[program:streaming]
command=/opt/homebrew/opt/node@24/bin/node ./streaming
directory=/Users/foo/Sites/mastodon
environment=NODE_ENV=production,PORT=4000,PATH="/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:%(ENV_PATH)s"
stdout_logfile=/Users/foo/Sites/mastodon/log/streaming.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=5
redirect_stderr=true
autorestart=true
stopasgroup=true
stopwaitsecs=15
